<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #f4f4f5;
    --surface: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --text-muted: #71717a;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --bubble-me: #3b82f6;
    --bubble-them: #f4f4f5;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; position: relative; }
  
  .hidden { display: none !important; }
  .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--primary-hover); }
  .input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; outline: none; }
  .input:focus { border-color: var(--primary); }

  /* Auth */
  #auth-screen { background: var(--surface); padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 340px; text-align: center; }
  #auth-screen h2 { margin-bottom: 20px; }
  .toggle-link { color: var(--primary); cursor: pointer; font-size: 14px; margin-top: 16px; display: inline-block; }

  /* App Layout */
  #app-screen { display: flex; width: 100%; height: 100%; max-width: 1200px; background: var(--surface); box-shadow: 0 0 20px rgba(0,0,0,0.05); }
  
  /* Sidebar */
  #sidebar { width: 300px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--surface); }
  .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: #fafafa; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-muted); }
  .tab.active { border-bottom: 2px solid var(--primary); color: var(--primary); }
  .list-container { flex: 1; overflow-y: auto; }
  
  /* List Items */
  .list-item { padding: 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  .list-item:hover { background: var(--bg); }
  .list-item.active { background: #eff6ff; }
  .item-name { font-weight: 600; font-size: 15px; }
  .item-status { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .req-btn { padding: 6px 10px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
  .accept { background: #22c55e; color: white; }
  .decline { background: #ef4444; color: white; }

  /* Chat Area */
  #chat-area { flex: 1; display: flex; flex-direction: column; background: #fafafa; }
  .chat-header { padding: 20px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; justify-content: space-between; align-items: center; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  
  .msg-row { display: flex; width: 100%; }
  .msg-row.me { justify-content: flex-end; }
  .msg-row.them { justify-content: flex-start; }
  .bubble { max-width: 70%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
  .msg-row.me .bubble { background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
  .msg-row.them .bubble { background: var(--bubble-them); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }

  .chat-input-bar { padding: 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; }
  #msg-input { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 24px; outline: none; font-size: 15px; }
  #msg-input:focus { border-color: var(--primary); }
  .send-btn { background: var(--primary); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .empty-state { flex: 1; display: flex; justify-content: center; align-items: center; color: var(--text-muted); font-size: 16px; flex-direction: column; text-align: center; padding: 20px;}
  
  .version-tag { position: absolute; bottom: 5px; right: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a1a1aa; opacity: 0.6; pointer-events: none; }
</style>
</head>
<body>

<div id="auth-screen">
  <h2 id="auth-title">Login</h2>
  <input type="text" id="username" class="input" placeholder="Benutzername" autocomplete="off">
  
  <div id="reg-fields" class="hidden">
    <select id="grade" class="input">
      <option value="" disabled selected>— Klasse wählen —</option>
      <option>5</option><option>6</option><option>7</option><option>8</option>
      <option>9</option><option>10</option><option>11</option><option>12</option><option>13</option>
    </select>
  </div>

  <input type="password" id="password" class="input" placeholder="Passwort">
  <p id="auth-error" style="color: red; font-size: 12px; margin-bottom: 10px;"></p>
  <button id="auth-btn" class="btn" style="width: 100%;" onclick="handleAuth()">Einloggen</button>
  <span class="toggle-link" onclick="toggleAuthMode()">Noch keinen Account? Registrieren</span>
</div>

<div id="app-screen" class="hidden">
  <div id="sidebar">
    <div class="sidebar-header">
      <div style="font-weight: 600; font-size: 18px;" id="my-name">User</div>
      <div style="font-size: 12px; color: var(--text-muted); cursor: pointer; margin-top: 4px;" onclick="logout()">Abmelden</div>
    </div>
    <div class="tabs">
      <div class="tab active" id="tab-chats" onclick="switchTab('chats')">Chats</div>
      <div class="tab" id="tab-reqs" onclick="switchTab('reqs')">Anfragen <span id="req-count" style="color:red; font-weight:bold;"></span></div>
      <div class="tab" id="tab-users" onclick="switchTab('users')">Suchen</div>
    </div>
    <div class="list-container" id="sidebar-list"></div>
  </div>

  <div id="chat-area">
    <div id="empty-chat" class="empty-state">
      Wähle einen Chat aus oder starte eine neue Unterhaltung.
    </div>
    
    <div id="active-chat" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
      <div class="chat-header">
        <h3 id="chat-partner-name">Name</h3>
      </div>
      <div id="messages"></div>
      <div class="chat-input-bar">
        <input type="text" id="msg-input" placeholder="Schreibe eine Nachricht..." autocomplete="off" onkeypress="handleEnter(event)">
        <button class="send-btn" onclick="sendMessage()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="version-tag">Beta V1.2</div>

<script>
/* --- CONFIG --- */
const SUPABASE_URL  = 'https://sigjwzivusuzmhvixtbm.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpZ2p3eml2dXN1em1odml4dGJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxNTI3MDksImV4cCI6MjA4ODcyODcwOX0.j0yB-NYM5HOkfKVBz24rWMBQNF8w-uEFjX55UGeD30E';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

/* --- STATE --- */
let isLoginMode = true;
let me = null;
let activeTab = 'chats';
let activeRoom = null;
let realtimeChannel = null;

let state = {
  users: [],
  rooms: [],
  texts: []
};

/* --- CRYPTO (Hashing for passwords) --- */
function genSalt(){const b=new Uint8Array(32);crypto.getRandomValues(b);return Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function hashPw(pw,saltHex){
  const enc=new TextEncoder(),salt=new Uint8Array(saltHex.match(/.{2}/g).map(h=>parseInt(h,16)));
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:200000},key,256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* --- AUTH --- */
function toggleAuthMode() {
  isLoginMode = !isLoginMode;
  document.getElementById('auth-title').innerText = isLoginMode ? 'Login' : 'Registrieren';
  document.getElementById('auth-btn').innerText = isLoginMode ? 'Einloggen' : 'Account erstellen';
  document.querySelector('.toggle-link').innerText = isLoginMode ? 'Noch keinen Account? Registrieren' : 'Bereits einen Account? Einloggen';
  document.getElementById('auth-error').innerText = '';
  document.getElementById('reg-fields').classList.toggle('hidden', isLoginMode);
}

async function handleAuth() {
  const user = document.getElementById('username').value.trim().toLowerCase();
  const pass = document.getElementById('password').value;
  const grade = document.getElementById('grade').value;
  const err = document.getElementById('auth-error');
  
  if(!user || !pass) return err.innerText = 'Bitte fülle alle Pflichtfelder aus.';
  if(pass.length < 6) return err.innerText = 'Passwort mind. 6 Zeichen.';
  if(!isLoginMode && !grade) return err.innerText = 'Bitte wähle eine Klasse.';

  const btn = document.getElementById('auth-btn');
  btn.disabled = true;

  try {
    if (isLoginMode) {
      // Nutze die alten DSN Login-Funktionen
      const { data: salt } = await db.rpc('dsn_get_salt', { p_username: user });
      if(!salt) throw new Error('Benutzer nicht gefunden.');
      const hashed = await hashPw(pass, salt);
      const { data: userData } = await db.rpc('dsn_login', { p_username: user, p_password_hash: hashed });
      if(!userData) throw new Error('Falsches Passwort.');
      me = userData;
    } else {
      // Registriere in der alten dsn_users Tabelle
      const { data: check } = await db.rpc('dsn_check_username', { p_username: user });
      if(!check) throw new Error('Benutzername vergeben.');
      
      const salt = genSalt();
      const hashed = await hashPw(pass, salt);
      const { data: newUser, error } = await db.from('dsn_users').insert([{ 
        username: user, 
        real_name: user, 
        grade: grade, 
        salt: salt, 
        password_hash: hashed, 
        show_name: true, 
        school: 'Andere Schule' 
      }]).select().single();
      
      if(error) throw error;
      me = newUser;
    }
    
    // Auth Success
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    document.getElementById('my-name').innerText = me.username;
    
    await loadInitialData();
    setupRealtime();

  } catch (error) {
    err.innerText = error.message;
  } finally {
    btn.disabled = false;
  }
}

function logout() {
  if (realtimeChannel) realtimeChannel.unsubscribe();
  me = null; activeRoom = null;
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
}

/* --- DATA LOADING --- */
async function loadInitialData() {
  // Lade alle alten dsn_users außer mir selbst
  const { data: users } = await db.from('dsn_users').select('id, username').neq('id', me.id);
  state.users = users || [];

  // Lade alle neuen nova_rooms
  const { data: rooms } = await db.from('nova_rooms')
    .select('*')
    .or(`member_one.eq.${me.id},member_two.eq.${me.id}`)
    .order('updated_at', { ascending: false });
  state.rooms = rooms || [];

  renderSidebar();
}

/* --- SIDEBAR RENDERING --- */
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-chats').classList.toggle('active', tab === 'chats');
  document.getElementById('tab-reqs').classList.toggle('active', tab === 'reqs');
  document.getElementById('tab-users').classList.toggle('active', tab === 'users');
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('sidebar-list');
  list.innerHTML = '';

  const pendingIncoming = state.rooms.filter(r => r.status === 'pending' && r.initiator !== me.id);
  document.getElementById('req-count').innerText = pendingIncoming.length > 0 ? `(${pendingIncoming.length})` : '';

  if (activeTab === 'chats') {
    const activeChats = state.rooms.filter(r => r.status === 'active');
    if(activeChats.length === 0) return list.innerHTML = '<div style="padding: 20px; color: gray; text-align: center;">Keine aktiven Chats.</div>';
    
    activeChats.forEach(room => {
      const otherId = room.member_one === me.id ? room.member_two : room.member_one;
      const otherUser = state.users.find(u => u.id === otherId);
      if(!otherUser) return;

      const div = document.createElement('div');
      div.className = `list-item ${activeRoom?.id === room.id ? 'active' : ''}`;
      div.onclick = () => openChat(room, otherUser);
      div.innerHTML = `
        <div>
          <div class="item-name">${otherUser.username}</div>
          <div class="item-status">Klicke zum Chatten</div>
        </div>
      `;
      list.appendChild(div);
    });

  } else if (activeTab === 'reqs') {
    if(pendingIncoming.length === 0) return list.innerHTML = '<div style="padding: 20px; color: gray; text-align: center;">Keine neuen Anfragen.</div>';
    
    pendingIncoming.forEach(room => {
      const otherUser = state.users.find(u => u.id === room.initiator);
      if(!otherUser) return;

      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `
        <div>
          <div class="item-name">${otherUser.username}</div>
          <div class="item-status">möchte chatten</div>
        </div>
        <div style="display:flex; gap: 8px;">
          <button class="req-btn accept" onclick="respondReq('${room.id}', 'active')">✔</button>
          <button class="req-btn decline" onclick="respondReq('${room.id}', 'rejected')">✖</button>
        </div>
      `;
      list.appendChild(div);
    });

  } else if (activeTab === 'users') {
    if (state.users.length === 0) {
      return list.innerHTML = '<div style="padding: 20px; color: gray; text-align: center;">Keine anderen Benutzer gefunden.</div>';
    }

    state.users.forEach(user => {
      const existingRoom = state.rooms.find(r => (r.member_one === user.id || r.member_two === user.id));
      
      const div = document.createElement('div');
      div.className = 'list-item';
      
      let actionHtml = '';
      if (!existingRoom) {
        actionHtml = `<button class="req-btn accept" onclick="startChat('${user.id}')">Anfragen</button>`;
      } else if (existingRoom.status === 'active') {
        actionHtml = `<span style="font-size:12px; color:var(--primary);">Im Chat</span>`;
      } else if (existingRoom.status === 'pending') {
        actionHtml = `<span style="font-size:12px; color:gray;">Ausstehend</span>`;
      }

      div.innerHTML = `
        <div class="item-name">${user.username}</div>
        <div>${actionHtml}</div>
      `;
      list.appendChild(div);
    });
  }
}

/* --- CHAT ACTIONS --- */
async function startChat(targetUserId) {
  const { data: newRoom, error } = await db.from('nova_rooms').insert({
    member_one: me.id,
    member_two: targetUserId,
    status: 'pending',
    initiator: me.id
  }).select().single();
  
  if(!error) {
    state.rooms.unshift(newRoom);
    renderSidebar();
    alert('Anfrage gesendet!');
  }
}

async function respondReq(roomId, newStatus) {
  await db.from('nova_rooms').update({ status: newStatus }).eq('id', roomId);
  const r = state.rooms.find(x => x.id === roomId);
  if(r) r.status = newStatus;
  
  if (newStatus === 'active') {
    switchTab('chats');
    const otherId = r.member_one === me.id ? r.member_two : r.member_one;
    const otherUser = state.users.find(u => u.id === otherId);
    openChat(r, otherUser);
  } else {
    renderSidebar();
  }
}

async function openChat(room, targetUser) {
  activeRoom = room;
  document.getElementById('empty-chat').classList.add('hidden');
  document.getElementById('active-chat').classList.remove('hidden');
  document.getElementById('active-chat').style.display = 'flex';
  document.getElementById('chat-partner-name').innerText = targetUser.username;
  document.getElementById('msg-input').focus();
  
  renderSidebar();

  const { data: texts } = await db.from('nova_texts').select('*').eq('room_id', room.id).order('created_at', { ascending: true });
  state.texts = texts || [];
  renderMessages();
}

function renderMessages() {
  const box = document.getElementById('messages');
  box.innerHTML = '';
  
  state.texts.forEach(txt => {
    const isMe = txt.author_id === me.id;
    const div = document.createElement('div');
    div.className = `msg-row ${isMe ? 'me' : 'them'}`;
    div.innerHTML = `<div class="bubble">${txt.body}</div>`;
    box.appendChild(div);
  });
  
  box.scrollTop = box.scrollHeight;
}

/* --- SEND MESSAGE --- */
function handleEnter(e) { if(e.key === 'Enter') sendMessage(); }

async function sendMessage() {
  if(!activeRoom) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if(!text) return;

  input.value = '';

  const tempMsg = { id: 'temp-'+Date.now(), author_id: me.id, body: text, room_id: activeRoom.id };
  state.texts.push(tempMsg);
  renderMessages();

  const { data, error } = await db.from('nova_texts').insert({
    room_id: activeRoom.id,
    author_id: me.id,
    body: text
  }).select().single();

  if(error) {
    alert('Fehler beim Senden!');
    state.texts = state.texts.filter(t => t.id !== tempMsg.id);
    renderMessages();
  } else {
    const idx = state.texts.findIndex(t => t.id === tempMsg.id);
    if(idx > -1) state.texts[idx] = data;
    await db.from('nova_rooms').update({ updated_at: new Date().toISOString() }).eq('id', activeRoom.id);
  }
}

/* --- REALTIME --- */
function setupRealtime() {
  realtimeChannel = db.channel('nova-public')
    // Höre auf neue DSN Accounts
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dsn_users' }, payload => {
      const newUser = payload.new;
      if (newUser.id !== me.id) {
        state.users.push(newUser);
        if (activeTab === 'users') renderSidebar();
      }
    })
    // Höre auf neue Nachrichten
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'nova_texts' }, payload => {
      const newText = payload.new;
      if (activeRoom && newText.room_id === activeRoom.id && newText.author_id !== me.id) {
        state.texts.push(newText);
        renderMessages();
      }
    })
    // Höre auf Chat-Anfragen
    .on('postgres_changes', { event: '*', schema: 'public', table: 'nova_rooms' }, async payload => {
      const { data: rooms } = await db.from('nova_rooms')
        .select('*')
        .or(`member_one.eq.${me.id},member_two.eq.${me.id}`)
        .order('updated_at', { ascending: false });
      state.rooms = rooms || [];
      renderSidebar();
    })
    .subscribe();
}
</script>
</body>
</html>
